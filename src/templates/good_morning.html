<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Greetings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px 0;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .container img {
            width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #2a9d8f;
        }
        p {
            font-size: 16px;
            color: #444;
            line-height: 1.6;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>

<!-- Morning Version -->
<div class="container">
    <img src="https://raw.githubusercontent.com/GB-Server/Email-Scheduler/main/WhatsApp%20Image%202025-04-14%20at%2013.44.48_b84528cb.jpg
    ">
    <h1>Good Morning!</h1>
    <p>Hope you woke up feeling refreshed and ready to take on the day.</p>
    <p>Let today be filled with new goals, positive energy, and small wins.</p>
    <div class="footer">Rise and shine, champion! ☀️</div>
</div>


</body>
</html>
