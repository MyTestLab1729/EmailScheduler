<!DOCTYPE html>
<html lang="en">
<head>

    <title>Email Greetings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;

            padding: 40px 0;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
